  <style>
  body { background-color:#434A53;}
  img { border-radius:5px;}
		.poster-main{
			position: relative;
      margin:30px auto;
      max-width:1000px;
		}
		.poster-main .poster-list .poster-item{
			position: absolute;
			left: 0;
			top: 0;
		}
		.poster-main .poster-btn{
			position: absolute;
			top: 0;
			cursor: pointer;
		}
		.poster-main .poster-prev-btn{
			left: 0;
			background: url("images/btn_l.png") no-repeat center center;
		}
		.poster-main .poster-next-btn{
			right: 0;
			background: url("images/btn_r.png") no-repeat center center;
		}
		
	</style> 
 </head>

 <h1 style="margin:150px auto 30px auto; text-align:center; color:#fff;">jQuery Carousel.js Rotator Plugin Demo</h1>

							"width":1000,
							"height":500,
							"posterWidth":600,
							"posterHeight":500,
							"scale":0.8,
							"speed":1000,
							"autoPlay":true,
							"delay":3000,
							"verticalAlign":"middle"
							}'> 
   <div class="poster-btn poster-prev-btn"></div> 
   <ul class="poster-list"> 
    <li class="poster-item"><a href="#"><img src="https://unsplash.it/600/500?image=237" alt="" width="100%" /></a></li> 
    <li class="poster-item"><a href="#"><img src="https://unsplash.it/600/500?image=239" alt="" width="100%" /></a></li>

   </ul> 
   <div class="poster-btn poster-next-btn"></div> 
  </div> 
  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
 <script src="js/Carousel.js"></script>
